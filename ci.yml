name: CI

# Прогоняем smoke-test на каждый push и pull request в основные ветки.
# Цель — поймать баги вроде отсутствующего импорта или синтаксической
# ошибки ДО того, как они попадут в прод на bothost, а не после того,
# как об этом напишет пользователь бота.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        env:
          DEV_MODE: "1"
          PORT: "8099"
        run: python scripts/smoke_test.py
