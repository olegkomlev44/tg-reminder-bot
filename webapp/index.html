<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #000000;
  --surface: #121212;
  --surface-alpha: rgba(18, 18, 18, 0.75);
  --border: #282828;
  --accent: #ffcc00; /* Желтый акцент Яндекса */
  --accent-glow: rgba(255, 204, 0, 0.4);
  --text: #ffffff;
  --text-sec: #a0a0a0;
  --nav-height: 65px;
  --mini-player-height: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body, html {
  height: 100%; width: 100%; overflow: hidden;
  background-color: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

#app { display: flex; flex-direction: column; height: 100dvh; position: relative; }

/* ── PAGES & SWIPE ── */
.pages { flex: 1; position: relative; overflow: hidden; width: 100%; }
.page { 
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding-bottom: calc(var(--nav-height) + var(--mini-player-height) + 20px);
  opacity: 0; pointer-events: none; transform: translateX(20px); transition: all 0.3s ease;
}
.page.on { opacity: 1; pointer-events: all; transform: translateX(0); }
.page.slide-left { transform: translateX(-20px); }

/* ── BOTTOM NAV (Яндекс стайл) ── */
.tabs {
  position: absolute; bottom: 0; width: 100%; height: var(--nav-height);
  background: var(--surface-alpha); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center; z-index: 20;
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-sec); font-size: 10px; font-weight: 500; gap: 4px; cursor: pointer; transition: 0.2s;
  flex: 1; height: 100%;
}
.tab svg { width: 24px; height: 24px; fill: currentColor; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tab.on { color: var(--text); }
.tab.on svg { fill: var(--accent); transform: scale(1.1); }

/* ── UI ELEMENTS ── */
.sec { padding: 20px 16px 10px; font-size: 22px; font-weight: 700; display: flex; align-items: center; }
.search-bar { padding: 16px; position: sticky; top: 0; background: var(--bg); z-index: 10; display: flex; gap: 10px;}
.search-bar input {
  flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 12px 16px; color: var(--text); font-size: 16px; outline: none; transition: 0.2s;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar button {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  color: var(--text); padding: 0 16px; cursor: pointer; display: flex; align-items: center;
}

/* ── TRACK LISTS ── */
ul { list-style: none; }
.track {
  display: flex; align-items: center; gap: 14px; padding: 10px 16px; cursor: pointer;
  transition: background 0.2s; border-radius: 12px; margin: 0 8px;
}
.track:active { background: rgba(255, 255, 255, 0.05); }
.track.now .ttitle { color: var(--accent); }
.cover {
  width: 48px; height: 48px; border-radius: 8px; background: var(--surface); overflow: hidden;
  position: relative; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.cover img { width: 100%; height: 100%; object-fit: cover; }
.tmeta { flex: 1; min-width: 0; }
.ttitle { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); transition: color 0.2s;}
.tartist { font-size: 13px; color: var(--text-sec); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav-btn {
  background: none; border: none; color: var(--text-sec); font-size: 22px; padding: 10px; cursor: pointer;
  transition: transform 0.2s; line-height: 1;
}
.fav-btn.loved { color: var(--accent); animation: pop 0.3s ease; }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

/* ── WAVE HERO ── */
.wave-hero {
  padding: 40px 20px; text-align: center;
  background: linear-gradient(180deg, rgba(255, 204, 0, 0.15) 0%, var(--bg) 100%);
}
.wave-hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
.wave-hero p { color: var(--text-sec); font-size: 14px; margin-bottom: 24px; }
.wave-btn {
  background: var(--accent); color: #000; border: none; border-radius: 24px;
  padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: 0 8px 24px var(--accent-glow); transition: transform 0.2s;
}
.wave-btn:active { transform: scale(0.95); }

/* ── MINI PLAYER ── */
#mini-player {
  position: absolute; bottom: calc(var(--nav-height) + 10px); left: 10px; right: 10px; height: var(--mini-player-height);
  background: var(--surface-alpha); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
  display: flex; align-items: center; padding: 0 12px; gap: 12px; z-index: 30;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: pointer;
  transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#mini-player.vis { transform: translateY(0); }
#mini-prog { position: absolute; bottom: 0; left: 16px; right: 16px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
#mini-prog-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; }
.mi-cover { width: 40px; height: 40px; border-radius: 6px; background: var(--border); overflow: hidden; }
.mi-cover img { width: 100%; height: 100%; object-fit: cover; }
.mi-info { flex: 1; min-width: 0; }
.mi-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi-artist { font-size: 12px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi-play { background: none; border: none; color: var(--text); font-size: 24px; padding: 10px; cursor: pointer; }

/* ── FULL SCREEN PLAYER ── */
#full-player {
  position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: var(--bg); overflow: hidden;
}
#full-player.vis { transform: translateY(0); }
.fp-bg {
  position: absolute; inset: -50px; background-size: cover; background-position: center;
  filter: blur(60px) brightness(0.4); z-index: -1; transition: background-image 0.5s ease;
}
.fp-top { display: flex; align-items: center; justify-content: space-between; padding: 20px; }
.fp-down { background: none; border: none; color: var(--text); font-size: 32px; padding: 10px; cursor: pointer; line-height: 0.5;}
.fp-cover-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
.fp-cover {
  width: min(85vw, 380px); aspect-ratio: 1; border-radius: 24px; overflow: hidden;
  box-shadow: 0 30px 60px rgba(0,0,0,0.6); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.fp-cover.paused { transform: scale(0.9); }
.fp-cover img { width: 100%; height: 100%; object-fit: cover; }
.fp-info { padding: 0 30px 20px; text-align: left; display: flex; justify-content: space-between; align-items: center;}
.fp-titles { flex: 1; min-width: 0; }
.fp-title { font-size: 24px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;}
.fp-artist { font-size: 16px; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* controls */
.fp-prog-wrap { padding: 0 30px; margin-bottom: 30px; }
.fp-prog { height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; position: relative; cursor: pointer; }
.fp-prog-fill { height: 100%; background: var(--text); border-radius: 3px; width: 0%; pointer-events: none; }
.fp-thumb { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: -5px; transform: translateX(-50%); pointer-events: none; }
.fp-times { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 8px; font-variant-numeric: tabular-nums;}

.fp-ctrl { display: flex; align-items: center; justify-content: space-between; padding: 0 40px 60px; }
.fp-btn { background: none; border: none; color: var(--text); font-size: 28px; cursor: pointer; padding: 10px; transition: 0.2s; }
.fp-btn.sec-btn { font-size: 22px; color: rgba(255,255,255,0.5); }
.fp-btn.sec-btn.active { color: var(--accent); }
.fp-play {
  background: var(--text); color: #000; width: 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 32px; transition: transform 0.1s;
}
.fp-play:active { transform: scale(0.9); }

/* SPINNER & EMPTY */
.spin { display: flex; justify-content: center; padding: 40px; }
.spin::after { content: ''; width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 60px 20px; color: var(--text-sec); }
.empty-ico { font-size: 48px; margin-bottom: 16px; filter: grayscale(1); opacity: 0.5; }

/* TOAST */
#toast {
  position: fixed; top: 20px; left: 50%; transform: translate(-50%, -20px);
  background: var(--surface); color: var(--text); padding: 12px 24px; border-radius: 20px;
  font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: 0.3s;
  z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border); white-space: nowrap;
}
#toast.vis { opacity: 1; transform: translate(-50%, 0); }
audio { display: none; }
</style>
</head>
<body>
<div id="app">

<div class="pages" id="pages">
  <div class="page on" id="page-wave">
    <div class="wave-hero">
      <h1>Моя Волна</h1>
      <p>Музыка под твой вкус</p>
      <button class="wave-btn" onclick="playWaveFromStart()">▶ Слушать</button>
    </div>
    <div class="sec">Рекомендации</div>
    <ul id="wave-list"></ul>
    <div id="wave-more" class="spin" style="display:none"></div>
  </div>

  <div class="page" id="page-search">
    <div class="search-bar">
      <input id="q" type="text" placeholder="Трек, артист, подкаст..." autocomplete="off">
      <button onclick="doSearch()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
      </button>
    </div>
    <ul id="search-list">
      <div class="empty"><div class="empty-ico">🔍</div><p>Введи название трека или имя артиста</p></div>
    </ul>
  </div>

  <div class="page" id="page-favs">
    <div class="sec">Мне нравится</div>
    <ul id="favs-list"></ul>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab on" onclick="nav('wave')">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M8 8v8M4 11v2M16 6v12M20 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Волна
  </div>
  <div class="tab" onclick="nav('search')">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
    Поиск
  </div>
  <div class="tab" onclick="nav('favs')">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
    Коллекция
  </div>
</div>

</div><div id="mini-player" onclick="openFull()">
  <div class="mi-cover" id="mini-cover">🎵</div>
  <div class="mi-info">
    <div class="mi-title" id="mini-title">Выбери трек</div>
    <div class="mi-artist" id="mini-artist"></div>
  </div>
  <button class="mi-play" id="mini-play" onclick="event.stopPropagation();togglePlay()">▶</button>
  <div id="mini-prog"><div id="mini-prog-fill"></div></div>
</div>

<div id="full-player">
  <div class="fp-bg" id="fp-bg"></div>
  <div class="fp-top">
    <button class="fp-down" onclick="closeFull()">⌄</button>
  </div>
  <div class="fp-cover-wrap">
    <div class="fp-cover paused" id="fp-cover">🎵</div>
  </div>
  <div class="fp-info">
    <div class="fp-titles">
      <div class="fp-title" id="fp-title">—</div>
      <div class="fp-artist" id="fp-artist"></div>
    </div>
    <button id="fp-fav" class="fav-btn" onclick="toggleFavFromPlayer()">♡</button>
  </div>
  <div class="fp-prog-wrap">
    <div class="fp-prog" id="fp-prog" onclick="seekClick(event)">
      <div class="fp-prog-fill" id="fp-fill"></div>
      <div class="fp-thumb" id="fp-thumb"></div>
    </div>
    <div class="fp-times"><span id="fp-cur">0:00</span><span id="fp-dur">0:00</span></div>
  </div>
  <div class="fp-ctrl">
    <button class="fp-btn sec-btn" id="btn-shuf" onclick="toggleShuffle()">🔀</button>
    <button class="fp-btn" onclick="playPrev()">⏮</button>
    <button class="fp-btn fp-play" id="fp-play" onclick="togglePlay()">▶</button>
    <button class="fp-btn" onclick="playNext()">⏭</button>
    <button class="fp-btn sec-btn" id="btn-rep" onclick="toggleRepeat()">🔁</button>
  </div>
</div>

<div id="toast"></div>
<audio id="aud"></audio>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.setHeaderColor('#000000');
tg.setBackgroundColor('#000000');

const aud = document.getElementById('aud');
let queue = [];
let qIdx = -1;
let shuffle = false;
let repeat = false;
let allData = { favs: [] }; // Локальная база
let waveOffset = 0;
let waveLoading = false;

// ── SWIPE LOGIC ──
let startX = 0;
const pagesEl = document.getElementById('pages');
const tabsOrder = ['wave', 'search', 'favs'];

pagesEl.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
pagesEl.addEventListener('touchend', e => {
  let endX = e.changedTouches[0].clientX;
  let diff = startX - endX;
  if (Math.abs(diff) > 70) {
    let curIdx = tabsOrder.findIndex(t => document.getElementById('page-'+t).classList.contains('on'));
    if (diff > 0 && curIdx < tabsOrder.length - 1) nav(tabsOrder[curIdx + 1]); // swipe left
    if (diff < 0 && curIdx > 0) nav(tabsOrder[curIdx - 1]); // swipe right
  }
}, {passive: true});

function nav(name) {
  let curIdx = tabsOrder.findIndex(t => document.getElementById('page-'+t).classList.contains('on'));
  let newIdx = tabsOrder.indexOf(name);
  
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('on', i === newIdx));
  document.querySelectorAll('.page').forEach((p, i) => {
    p.classList.remove('on', 'slide-left');
    if (i === newIdx) p.classList.add('on');
    else if (i < newIdx) p.classList.add('slide-left'); // Старая уезжает влево
  });
}

// ── DATA FETCHING ──
async function loadData() {
  try {
    const r = await fetch('/api/tracks', {headers:{Authorization: tg.initData}});
    if (r.ok) {
      const data = await r.json();
      allData.favs = data.favs || [];
      renderFavs();
    }
  } catch (e) { console.error("Ошибка загрузки данных", e); }
}

async function loadWave(reset = false) {
  if (waveLoading) return;
  if (reset) { waveOffset = 0; document.getElementById('wave-list').innerHTML = ''; }
  waveLoading = true;
  document.getElementById('wave-more').style.display = 'flex';
  try {
    const r = await fetch(`/api/wave?limit=20&offset=${waveOffset}`, {headers:{Authorization: tg.initData}});
    const tracks = await r.json();
    if (tracks.length) {
      appendTracks(tracks, document.getElementById('wave-list'), 'wave');
      waveOffset += tracks.length;
    }
  } catch (e) { toast('Ошибка загрузки волны'); }
  waveLoading = false;
  document.getElementById('wave-more').style.display = 'none';
}

pagesEl.addEventListener('scroll', function(e) {
  if (e.target.id === 'page-wave' && e.target.scrollTop + e.target.clientHeight >= e.target.scrollHeight - 200) {
    loadWave();
  }
}, true);

// ── RENDER ENGINE ──
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function isFav(id) { return allData.favs.some(t => String(t.id) === String(id)); }

function makeItem(t, ctx) {
  const li = document.createElement('li');
  li.className = 'track';
  li.dataset.id = t.id;
  const loved = isFav(t.id);
  const cover = t.artwork_url ? `<img src="${esc(t.artwork_url)}" loading="lazy">` : '';
  
  // Сохраняем полный JSON трека в кнопке для мгновенного добавления
  const trackJson = esc(JSON.stringify(t)); 

  li.innerHTML = `
    <div class="cover">${cover}</div>
    <div class="tmeta">
      <div class="ttitle">${esc(t.title)}</div>
      <div class="tartist">${esc(t.artist)}</div>
    </div>
    <button class="fav-btn ${loved ? 'loved' : ''}" onclick="event.stopPropagation();favToggle(this, '${trackJson}')">
      ${loved ? '❤️' : '♡'}
    </button>`;
    
  li.addEventListener('click', () => {
    // Определяем из какого списка мы запускаем трек
    if (ctx === 'wave') {
      const domTracks = Array.from(document.getElementById('wave-list').children);
      queue = domTracks.map(el => JSON.parse(el.querySelector('.fav-btn').getAttribute('onclick').match(/'([^']+)'\)/)[1].replace(/&quot;/g, '"')));
    } else if (ctx === 'search') {
      const domTracks = Array.from(document.getElementById('search-list').children);
      queue = domTracks.map(el => JSON.parse(el.querySelector('.fav-btn').getAttribute('onclick').match(/'([^']+)'\)/)[1].replace(/&quot;/g, '"')));
    } else if (ctx === 'fav') {
      queue = [...allData.favs];
    }
    qIdx = queue.findIndex(x => String(x.id) === String(t.id));
    playTrack(t);
  });
  return li;
}

function appendTracks(tracks, ul, ctx) {
  tracks.forEach(t => ul.appendChild(makeItem(t, ctx)));
}

function renderFavs() {
  const ul = document.getElementById('favs-list');
  ul.innerHTML = '';
  if (!allData.favs.length) { 
    ul.innerHTML = `<div class="empty"><div class="empty-ico">🖤</div><p>Здесь пока пусто.<br>Нажимай на сердечки.</p></div>`; 
    return; 
  }
  appendTracks(allData.favs, ul, 'fav');
  updateAllHeartButtons();
}

// ── SEARCH ──
let searchT = null;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(searchT);
  if(e.target.value.trim().length >= 3) searchT = setTimeout(doSearch, 600);
});

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  const ul = document.getElementById('search-list');
  if (!q) return;
  ul.innerHTML = '<li class="spin"></li>';
  try {
    const r = await fetch('/api/search?q='+encodeURIComponent(q));
    const tracks = await r.json();
    ul.innerHTML = '';
    if (!tracks.length) { ul.innerHTML = `<div class="empty"><div class="empty-ico">😶</div><p>Ничего не найдено</p></div>`; return; }
    appendTracks(tracks, ul, 'search');
  } catch { ul.innerHTML = `<div class="empty"><p>Ошибка поиска</p></div>`; }
}

// ── FAVORITES LOGIC (FIXED) ──
async function favToggle(btn, trackJsonStr) {
  // Декодируем HTML сущности обратно в JSON строку
  const decodedStr = trackJsonStr.replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#39;/g, "'");
  const track = JSON.parse(decodedStr);
  const trackId = String(track.id);
  const loved = isFav(trackId);

  // Мгновенный апдейт UI
  if (loved) {
    allData.favs = allData.favs.filter(t => String(t.id) !== trackId);
    toast('Убрано из коллекции');
  } else {
    allData.favs.unshift(track); // Добавляем в начало
    toast('Добавлено в коллекцию');
  }
  
  renderFavs();
  updateAllHeartButtons();
  if (qIdx >= 0 && queue[qIdx] && String(queue[qIdx].id) === trackId) updateFavBtnPlayer();

  // Отправляем на сервер в фоне
  try {
    await fetch('/api/fav', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': tg.initData || 'dummy_for_testing' },
      body: JSON.stringify({ track_id: trackId, track_data: track })
    });
  } catch (e) { console.error("Не удалось сохранить на сервер", e); }
}

function updateAllHeartButtons() {
  document.querySelectorAll('.fav-btn').forEach(btn => {
    // Пропускаем кнопку в полноэкранном плеере, у нее другой id/логика
    if(btn.id === 'fp-fav') return; 
    
    const li = btn.closest('.track');
    if(li) {
      const loved = isFav(li.dataset.id);
      btn.textContent = loved ? '❤️' : '♡';
      btn.classList.toggle('loved', loved);
    }
  });
}

function toggleFavFromPlayer() {
  if (qIdx < 0 || !queue[qIdx]) return;
  const t = queue[qIdx];
  const str = JSON.stringify(t).replace(/"/g, '&quot;');
  favToggle(document.getElementById('fp-fav'), str);
}

function updateFavBtnPlayer() {
  if (qIdx < 0 || !queue[qIdx]) return;
  const loved = isFav(queue[qIdx].id);
  const btn = document.getElementById('fp-fav');
  btn.textContent = loved ? '❤️' : '♡';
  btn.classList.toggle('loved', loved);
}

// ── PLAYER LOGIC ──
function playWaveFromStart() {
  const waveList = document.getElementById('wave-list');
  if (waveList.children.length === 0) { toast('Волна загружается...'); return; }
  
  queue = Array.from(waveList.children).map(el => {
    const jsonStr = el.querySelector('.fav-btn').getAttribute('onclick').match(/'([^']+)'\)/)[1].replace(/&quot;/g, '"');
    return JSON.parse(jsonStr);
  });
  
  qIdx = 0;
  playTrack(queue[0]);
  openFull();
}

function playTrack(t) {
  if (!t) return;
  
  ['mini-title', 'fp-title'].forEach(id => document.getElementById(id).textContent = t.title);
  ['mini-artist', 'fp-artist'].forEach(id => document.getElementById(id).textContent = t.artist);

  const imgHtml = t.artwork_url ? `<img src="${esc(t.artwork_url)}">` : '🎵';
  document.getElementById('mini-cover').innerHTML = imgHtml;
  document.getElementById('fp-cover').innerHTML = imgHtml;
  
  if (t.artwork_url) {
    document.getElementById('fp-bg').style.backgroundImage = `url('${esc(t.artwork_url)}')`;
  } else {
    document.getElementById('fp-bg').style.backgroundImage = 'none';
  }

  document.getElementById('mini-player').classList.add('vis');
  document.querySelectorAll('.track').forEach(li => li.classList.toggle('now', String(li.dataset.id) === String(t.id)));

  updateFavBtnPlayer();

  aud.src = `/api/stream/${encodeURIComponent(t.id)}`;
  aud.load();
  aud.play().catch(e => { console.warn('Autoplay blocked'); });

  setPlayState(true);
}

function setPlayState(playing) {
  const icon = playing ? '⏸' : '▶';
  document.getElementById('mini-play').textContent = icon;
  document.getElementById('fp-play').textContent = icon;
  if(playing) {
    document.getElementById('fp-cover').classList.remove('paused');
  } else {
    document.getElementById('fp-cover').classList.add('paused');
  }
}

function togglePlay() {
  if (aud.paused) { aud.play(); setPlayState(true); } 
  else { aud.pause(); setPlayState(false); }
}

function playPrev() {
  if (!queue.length) return;
  if (aud.currentTime > 3) { aud.currentTime = 0; return; }
  qIdx = (qIdx - 1 + queue.length) % queue.length;
  playTrack(queue[qIdx]);
}

function playNext() {
  if (!queue.length) return;
  if (shuffle) qIdx = Math.floor(Math.random() * queue.length);
  else qIdx = (qIdx + 1) % queue.length;
  playTrack(queue[qIdx]);
  
  // Бесконечная волна
  if (qIdx >= queue.length - 3) loadWave();
}

function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById('btn-shuf').classList.toggle('active', shuffle);
  toast(shuffle ? 'Перемешивание включено' : 'Перемешивание выключено');
}

function toggleRepeat() {
  repeat = !repeat;
  document.getElementById('btn-rep').classList.toggle('active', repeat);
  toast(repeat ? 'Повтор включен' : 'Повтор выключен');
}

// UI Progress
function fmt(s){ return isNaN(s) ? '0:00' : `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }
aud.addEventListener('timeupdate', () => {
  if (!aud.duration) return;
  const p = aud.currentTime / aud.duration;
  document.getElementById('mini-prog-fill').style.width = (p * 100) + '%';
  document.getElementById('fp-fill').style.width = (p * 100) + '%';
  document.getElementById('fp-thumb').style.left = (p * 100) + '%';
  document.getElementById('fp-cur').textContent = fmt(aud.currentTime);
  document.getElementById('fp-dur').textContent = fmt(aud.duration);
});

aud.addEventListener('ended', () => { repeat ? (aud.currentTime = 0, aud.play()) : playNext(); });
aud.addEventListener('pause', () => setPlayState(false));
aud.addEventListener('play', () => setPlayState(true));
aud.addEventListener('error', () => { toast('Ошибка потока, включаю следующий'); setTimeout(playNext, 1500); });

// Seek Logic
function seekClick(e) {
  const bar = document.getElementById('fp-prog');
  const ratio = e.offsetX / bar.offsetWidth;
  if (aud.duration) aud.currentTime = ratio * aud.duration;
}

// Screen management
function openFull() { document.getElementById('full-player').classList.add('vis'); }
function closeFull() { document.getElementById('full-player').classList.remove('vis'); }

let touchStartY = 0;
document.getElementById('full-player').addEventListener('touchstart', e => touchStartY = e.touches[0].clientY, {passive: true});
document.getElementById('full-player').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchStartY > 80) closeFull();
}, {passive: true});

// Toast
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('vis');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('vis'), 2000);
}

// Init
loadData().then(() => loadWave(true));
</script>
</body>
</html>
